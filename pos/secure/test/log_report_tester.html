<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs & Dashboard Report Tester</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --input-bg: #0f172a;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 24px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .badge {
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* Global Config Section */
        .config-bar {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"], input[type="url"], input[type="date"], select {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        /* Tabs System */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
        }

        /* Content Dashboard Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .config-bar {
                grid-template-columns: 1fr;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Buttons */
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Response Display */
        .response-box {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
            min-height: 350px;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
        }

        .status-badge.success {
            display: inline-block;
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-badge.error {
            display: inline-block;
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-copy {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            border: none;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-copy:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">
            <h1>Logs & Dashboard Report Tester</h1>
            <span class="badge">Actions: 1118 (Logs), 1127 (Report Summary)</span>
        </div>
        <div id="connectionStatus" style="font-size: 0.85rem; color: var(--text-muted);">
            Ready
        </div>
    </header>

    <!-- Global API Configuration -->
    <div class="config-bar">
        <div class="form-group">
            <label for="apiUrl">API Endpoint URL</label>
            <input type="url" id="apiUrl" value="../index.php" placeholder="../index.php">
        </div>
        <div class="form-group">
            <label for="bearerToken">Bearer JWT Token (Stored automatically)</label>
            <input type="text" id="bearerToken" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
        </div>
    </div>

    <!-- Actions Tab Bar -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1118')">Activity Logs (1118)</button>
        <button class="tab-btn" onclick="switchTab('tab1127')">Dashboard Summary (1127)</button>
    </div>

    <!-- Main Dashboard Grid -->
    <div class="dashboard-grid">
        <!-- Request Form Column -->
        <div class="card">

            <!-- TAB 1118: GET ACTIVITY LOGS -->
            <form id="tab1118" class="tab-content active" onsubmit="handleRequest(event, '1118')">
                <div class="card-header">Action 1118: Retrieve Activity Logs</div>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Fetch complete system audit logs and history activities.</p>
                <button type="submit" class="btn" style="margin-top: 15px;">Fetch All Logs</button>
            </form>

            <!-- TAB 1127: DASHBOARD SUMMARY REPORT -->
            <form id="tab1127" class="tab-content" onsubmit="handleRequest(event, '1127')">
                <div class="card-header">Action 1127: Dashboard Summary & Reports</div>
                
                <div class="form-group">
                    <label>Filter Type *</label>
                    <select id="report_filter" onchange="toggleCustomDates(this.value)" required>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                        <option value="custom">Custom Date Range</option>
                    </select>
                </div>

                <div id="customDateFields" style="display: none; flex-direction: column; gap: 10px;">
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="report_start_date">
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" id="report_end_date">
                    </div>
                </div>

                <button type="submit" class="btn">Get Dashboard Summary</button>
            </form>

        </div>

        <!-- Response Console Column -->
        <div class="card">
            <div class="card-header">
                <span>API Response Output</span>
                <div>
                    <span id="statusBadge" class="status-badge"></span>
                    <button class="btn-copy" onclick="copyResponse()">Copy JSON</button>
                </div>
            </div>
            <pre id="responseOutput" class="response-box">// Waiting for request...</pre>
        </div>
    </div>

    <script>
        // Initialize localStorage state
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('log_report_api_token');
            const savedUrl = localStorage.getItem('log_report_api_url');
            if (savedToken) document.getElementById('bearerToken').value = savedToken;
            if (savedUrl) document.getElementById('apiUrl').value = savedUrl;

            document.getElementById('bearerToken').addEventListener('input', (e) => {
                localStorage.setItem('log_report_api_token', e.target.value.trim());
            });

            document.getElementById('apiUrl').addEventListener('input', (e) => {
                localStorage.setItem('log_report_api_url', e.target.value.trim());
            });
        });

        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Toggle custom date visibility for report filter
        function toggleCustomDates(value) {
            const customBox = document.getElementById('customDateFields');
            if (value === 'custom') {
                customBox.style.display = 'flex';
            } else {
                customBox.style.display = 'none';
            }
        }

        // Send API Request Handler
        async function handleRequest(event, actionCode) {
            event.preventDefault();

            const url = document.getElementById('apiUrl').value.trim();
            const token = document.getElementById('bearerToken').value.trim();
            const responseOutput = document.getElementById('responseOutput');
            const statusBadge = document.getElementById('statusBadge');
            const connectionStatus = document.getElementById('connectionStatus');

            if (!url) {
                alert("Please provide a valid API Endpoint URL!");
                return;
            }

            let payload = { action: actionCode };

            // Construct Payloads based on Action Codes
            if (actionCode === '1118') {
                // Action 1118 requires only action code & token[cite: 29]
            } else if (actionCode === '1127') {
                payload.filter = document.getElementById('report_filter').value;
                if (payload.filter === 'custom') {
                    payload.start_date = document.getElementById('report_start_date').value;
                    payload.end_date = document.getElementById('report_end_date').value;
                }
            }

            const headers = {
                'Content-Type': 'application/json'
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            responseOutput.textContent = "// Sending request...";
            connectionStatus.textContent = "Processing...";

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                const httpStatus = response.status;
                const responseData = await response.json();

                // Format JSON output
                responseOutput.textContent = JSON.stringify(responseData, null, 2);

                // Update Status UI
                statusBadge.textContent = `HTTP ${httpStatus}`;
                statusBadge.className = `status-badge ${response.ok ? 'success' : 'error'}`;
                connectionStatus.textContent = response.ok ? "Last Request Succeeded" : "Last Request Failed";

            } catch (error) {
                responseOutput.textContent = `Error sending request:\n${error.message}`;
                statusBadge.textContent = "Error";
                statusBadge.className = "status-badge error";
                connectionStatus.textContent = "Request Failed";
            }
        }

        // Copy Response JSON
        function copyResponse() {
            const text = document.getElementById('responseOutput').textContent;
            if (!text || text.startsWith("//")) return;

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            alert("Response JSON copied to clipboard!");
        }
    </script>
</body>
</html>
