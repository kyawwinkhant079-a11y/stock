<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop & Branch Management Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 pb-4 border-b border-slate-800 gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
                    <i class="fa-solid fa-store mr-2"></i> Shop & Branch Management
                </h1>
                <p class="text-sm text-slate-400 mt-1">API actions testing interface (Actions: 1000, 1001, 1002, 1003)</p>
            </div>
            
            <!-- Auth Token Input -->
            <div class="w-full md:w-auto flex items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400 pl-2 font-mono">X-TOKEN:</span>
                <input type="text" id="authToken" placeholder="Enter JWT Token..." 
                    class="bg-slate-950 text-xs px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-cyan-500 w-64 text-slate-200">
            </div>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Form Section (Add / Update Shop) -->
            <div class="lg:col-span-1 bg-slate-900/50 backdrop-blur border border-slate-800 p-6 rounded-2xl shadow-xl h-fit">
                <h2 id="formTitle" class="text-lg font-semibold mb-4 text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Add New Branch
                </h2>
                
                <form id="shopForm" class="space-y-4">
                    <input type="hidden" id="shopId" value="">
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Shop / Branch Name</label>
                        <input type="text" id="shopName" required placeholder="e.g. Mandalay Main Branch"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Owner Name</label>
                        <input type="text" id="ownerName" required placeholder="e.g. Kyaw Win Khant"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Phone Number</label>
                        <input type="text" id="shopPhone" required placeholder="e.g. 09912345678"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Address</label>
                        <textarea id="shopAddress" rows="2" required placeholder="e.g. 73rd Street, Mandalay"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition"></textarea>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="saveBtn"
                            class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-cyan-900/20 cursor-pointer">
                            Save Branch
                        </button>
                        <button type="button" id="cancelBtn" onclick="resetForm()" style="display: none;"
                            class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl text-sm transition cursor-pointer">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- List & Response Section -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Branches List Section -->
                <div class="bg-slate-900/50 backdrop-blur border border-slate-800 p-6 rounded-2xl shadow-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-indigo-400 flex items-center gap-2">
                            <i class="fa-solid fa-list"></i> Branches List (Action 1003)
                        </h2>
                        <button onclick="fetchBranches()" 
                            class="bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-rotate"></i> Refresh
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase tracking-wider">
                                    <th class="py-3 px-4">Name</th>
                                    <th class="py-3 px-4">Address</th>
                                    <th class="py-3 px-4">Phone</th>
                                    <th class="py-3 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="branchTableBody" class="divide-y divide-slate-800/60 text-sm">
                                <tr>
                                    <td colspan="4" class="py-6 text-center text-slate-500">Loading branches...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- API Response Log Box -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex justify-between items-center mb-2 px-2">
                        <span class="text-xs font-mono text-slate-400 flex items-center gap-2">
                            <i class="fa-solid fa-terminal text-cyan-400"></i> API Response Log
                        </span>
                        <button onclick="clearLogs()" class="text-xs text-slate-500 hover:text-slate-300 cursor-pointer">Clear</button>
                    </div>
                    <pre id="apiResponse" class="bg-slate-950 p-4 rounded-xl text-xs font-mono text-emerald-400 overflow-x-auto max-h-48 border border-slate-900/50">// Response will appear here...</pre>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = '../index.php'; 

        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem("jwt_token");
            if (savedToken) {
                document.getElementById("authToken").value = savedToken;
            }

            fetchBranches();
            
            document.getElementById("shopForm").addEventListener("submit", function(e) {
                e.preventDefault();
                submitForm();
            });
        });

        async function sendApiRequest(actionCode, payloadData = {}) {
            const token = document.getElementById("authToken").value.trim();
            
            const payload = {
                action: actionCode,
                token: token,
                ...payloadData
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-TOKEN': token
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                document.getElementById("apiResponse").textContent = JSON.stringify(result, null, 2);
                return result;
            } catch (error) {
                const errObj = { status: 500, message: "Network or JSON Parse Error: " + error.message };
                document.getElementById("apiResponse").textContent = JSON.stringify(errObj, null, 2);
                return null;
            }
        }

        // 1. ဆိုင်ခွဲများ ဆွဲထုတ်ရန် (Action 1003)
        async function fetchBranches() {
            const tbody = document.getElementById("branchTableBody");
            tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-500">Loading...</td></tr>`;

            const res = await sendApiRequest("1003");

            if (res && res.status === 200 && res.data) {
                if (res.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-500">No branches found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                res.data.forEach(branch => {
                    const name = branch.name ? branch.name.trim() : '';
                    const address = branch.address ? branch.address.trim() : '';
                    const phone = branch.phone ? branch.phone.trim() : '';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-900/40 transition">
                            <td class="py-3 px-4 font-medium text-slate-200">${name}</td>
                            <td class="py-3 px-4 text-slate-400 text-xs">${address}</td>
                            <td class="py-3 px-4 text-slate-400 text-xs">${phone}</td>
                            <td class="py-3 px-4 text-right space-x-2">
                                <button onclick="editBranch('${branch.id}', '${name.replace(/'/g, "\\'")}', '${address.replace(/'/g, "\\'")}', '${phone.replace(/'/g, "\\'")}')" 
                                    class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-lg text-xs transition cursor-pointer" title="Edit">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deleteBranch('${branch.id}')" 
                                    class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-2.5 py-1 rounded-lg text-xs transition cursor-pointer" title="Delete">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-rose-400">${res ? res.message : "Failed to load"}</td></tr>`;
            }
        }

        // 2. ဆိုင်အသစ်ထည့်ခြင်း (Action 1000) သို့မဟုတ် ပြင်ဆင်ခြင်း (Action 1001)
        async function submitForm() {
            const id = document.getElementById("shopId").value.trim();
            const shop_name = document.getElementById("shopName").value.trim();
            const owner_name = document.getElementById("ownerName").value.trim();
            const phone_no = document.getElementById("shopPhone").value.trim();
            const address = document.getElementById("shopAddress").value.trim();

            if (!id) {
                // Action 1000: Add Shop
                const res = await sendApiRequest("1000", { shop_name, owner_name, phone_no, address });
                if (res && res.status === 200) {
                    resetForm();
                    fetchBranches();
                }
            } else {
                // Action 1001: Update Shop
                const res = await sendApiRequest("1001", { id, uuid: id, shop_name, owner_name, phone_no, address });
                if (res && res.status === 200) {
                    resetForm();
                    fetchBranches();
                }
            }
        }

        // 3. ဆိုင်ခွဲဖျက်ရန် (Action 1002)
        async function deleteBranch(id) {
            if (!confirm("Are you sure you want to delete this branch?")) return;

            const res = await sendApiRequest("1002", { id, uuid: id });
            if (res && res.status === 200) {
                fetchBranches();
            }
        }

        function editBranch(id, name, address, phone) {
            document.getElementById("shopId").value = id;
            document.getElementById("shopName").value = name;
            document.getElementById("shopAddress").value = address;
            document.getElementById("shopPhone").value = phone;

            document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Edit Branch`;
            document.getElementById("saveBtn").textContent = "Update Branch";
            document.getElementById("saveBtn").className = "flex-1 bg-amber-600 hover:bg-amber-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-amber-900/25 cursor-pointer";
            document.getElementById("cancelBtn").style.display = "block";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById("shopForm").reset();
            document.getElementById("shopId").value = "";
            document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-plus-circle"></i> Add New Branch`;
            document.getElementById("saveBtn").textContent = "Save Branch";
            document.getElementById("saveBtn").className = "flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-cyan-900/20 cursor-pointer";
            document.getElementById("cancelBtn").style.display = "none";
        }

        function clearLogs() {
            document.getElementById("apiResponse").textContent = "// Response cleared.";
        }
    </script>
</body>
</html>
